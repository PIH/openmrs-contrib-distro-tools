name: Build and deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: OpenMRS image name, without tag. Omit to skip building/pushing a Docker image (eg. for module or package repos with no distro to build).
        required: false
        type: string
        default: ''
      image_variants:
        description: Optional additional tags of image_name built from the same distro on variants of the base image, one per line as <tag suffix>=<base image variant> (e.g. java8=amazoncorretto-8 pushes latest-java8 and <version>-java8; an empty variant uses the default base image)
        required: false
        type: string
        default: ''
      maven_profiles:
        description: Comma-separated Maven profiles to activate during deploy (e.g. distro-zip)
        required: false
        type: string
        default: ''
      notify_ci_dashboard:
        description: Notify PIH/ci-dashboard via repository_dispatch when this build starts and finishes
        required: false
        type: boolean
        default: false
      docker_build_args:
        description: Optional build arguments for the Docker image, one per line as NAME=value (e.g. an ETL image's PETL_BASE_IMAGE=partnersinhealth/petl@sha256:...)
        required: false
        type: string
        default: ''
      docker_context:
        description: Docker build context directory, relative to the repo root (a built distro/web directory for an OpenMRS distro)
        required: false
        type: string
        default: 'distro/target/distro/web'
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      DOCKERHUB_PASSWORD:
        required: false

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (build started)
        if: inputs.notify_ci_dashboard == true
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: started

      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
          server-id: central
          server-username: MAVEN_DEPLOY_USERNAME
          server-password: MAVEN_DEPLOY_PASSWORD

      - name: Maven Deploy
        id: maven-deploy
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/maven-deploy@main
        with:
          maven_profiles: ${{ inputs.maven_profiles }}
          username: ${{ secrets.SONATYPE_USERNAME }}
          password: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Build and Push Docker Image
        if: inputs.image_name != ''
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/build-and-push-docker@main
        with:
          image_name: ${{ inputs.image_name }}
          context: ${{ inputs.docker_context }}
          version: ${{ steps.maven-deploy.outputs.version }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          image_variants: ${{ inputs.image_variants }}
          build_args: ${{ inputs.docker_build_args }}

  notify-ci-dashboard:
    needs: build-and-publish
    if: always() && inputs.notify_ci_dashboard == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (build finished)
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: finished
