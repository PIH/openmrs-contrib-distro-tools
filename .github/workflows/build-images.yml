name: Build helper images

# Every images/<name>/ and services/<name>/image/ is published as partnersinhealth/<name>, tagged by the
# content hash of its folder (lib/image-tag.sh). A tag that exists is never rebuilt or overwritten. On
# main, missing tags are pushed and `latest` is moved to each image's current tag; pull requests build
# without pushing. (Seed images are built by build-seeded-image.yml, not here.)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'images/**'
      - 'services/*/image/**'
      - 'lib/image-tag.sh'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'services/*/image/**'
      - 'lib/image-tag.sh'
      - '.github/workflows/build-images.yml'

# Two runs on main would race to push the same tag, so they queue; a PR's newer commit cancels its older run.
concurrency:
  group: build-images-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # Logged in first, so the set-up images pull as pihci, not anonymously (rate limited).
      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up QEMU
        if: env.PUSH == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, and on main push missing tags
        id: images
        shell: bash
        run: |
          set -euo pipefail
          for dir in images/*/ services/*/image/; do
            [ -d "$dir" ] || continue
            dir=${dir%/}
            case "$dir" in
              services/*) name=$(basename "$(dirname "$dir")") ;;
              *) name=$(basename "$dir") ;;
            esac
            image=partnersinhealth/$name
            tag=$(lib/image-tag.sh "$dir")
            platforms=linux/amd64,linux/arm64
            echo "::group::$image:$tag"
            if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
              echo "$image:$tag is published; not rebuilt"
            elif [ "$PUSH" = true ]; then
              docker buildx build --push --platform "$platforms" -t "$image:$tag" "$dir"
            else
              docker build -t "$image:$tag" "$dir"
            fi
            if [ "$PUSH" = true ]; then
              docker buildx imagetools create -t "$image:latest" "$image:$tag"
            fi
            echo "::endgroup::"
          done
