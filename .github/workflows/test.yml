name: Test

on:
  push:
    branches:
      - 'main'
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'utils/**'
      - 'docker/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/test.yml'
      - '.github/workflows/*-via-runner.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'utils/**'
      - 'docker/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/test.yml'
      - '.github/workflows/*-via-runner.yml'

jobs:
  static-and-args:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: test/run static

      - name: Argument and safety checks
        run: test/run args

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Backup and restore round trips
        # Twice the runner's CPUs: the tests mostly wait on containers starting.
        run: TEST_JOBS=8 test/run integration
