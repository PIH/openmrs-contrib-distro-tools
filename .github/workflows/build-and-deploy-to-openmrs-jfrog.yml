name: Build and deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: OpenMRS image name, without tag
        required: true
        type: string
      maven_profiles:
        description: Comma-separated Maven profiles to activate during deploy (e.g. distro-zip)
        required: false
        type: string
        default: ''
    secrets:
      OPENMRS_MAVEN_USERNAME:
        required: true
      OPENMRS_MAVEN_PASSWORD:
        required: true
      DOCKERHUB_PASSWORD:
        required: true

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
          server-id: openmrs-repo-modules-pih
          server-username: OPENMRS_MAVEN_USERNAME
          server-password: OPENMRS_MAVEN_PASSWORD

      - name: Maven Deploy
        run: mvn -B -U deploy --file pom.xml${{ inputs.maven_profiles != '' && format(' -P{0}', inputs.maven_profiles) || '' }}
        env:
          OPENMRS_MAVEN_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OPENMRS_MAVEN_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}

      - name: Extract pom version
        run: echo "DOCKER_IMAGE_TAG_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: distro/target/distro/web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:${{ env.DOCKER_IMAGE_TAG_VERSION }}
