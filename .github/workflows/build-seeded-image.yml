name: Build seed image

on:
  workflow_call:
    inputs:
      image_name:
        description: OpenMRS image name, without tag
        required: true
        type: string
      pih_config:
        description: PIH config profile to seed, for a distro that uses one. Also used (lowercased) as the openmrs-docker instance name and, unless instance_name/seed_image_name is set, the seed image tag suffix.
        required: false
        type: string
      instance_name:
        description: openmrs-docker instance name and, unless seed_image_name is set, the seed image tag suffix. Defaults to pih_config, lowercased. Required if the distro has no pih_config to default from.
        required: false
        type: string
      seed_image_name:
        description: Full seed image name, without tag. Defaults to "<image_name>-seed-<instance_name>".
        required: false
        type: string
    secrets:
      DOCKERHUB_PASSWORD:
        required: true

jobs:
  build-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out calling repo
        uses: actions/checkout@v7

      - name: Check out openmrs-contrib-distro-tools
        uses: actions/checkout@v7
        with:
          repository: PIH/openmrs-contrib-distro-tools
          path: .openmrs-contrib-distro-tools

      - name: Resolve instance name and seed image name
        run: |
          INSTANCE_NAME="${{ inputs.instance_name }}"
          if [ -z "$INSTANCE_NAME" ]; then
            INSTANCE_NAME=$(echo "${{ inputs.pih_config }}" | tr '[:upper:]' '[:lower:]')
          fi
          if [ -z "$INSTANCE_NAME" ]; then
            echo "Either instance_name or pih_config must be set" >&2
            exit 1
          fi
          echo "INSTANCE_NAME=$INSTANCE_NAME" >> $GITHUB_ENV
          SEED_IMAGE_NAME="${{ inputs.seed_image_name }}"
          if [ -z "$SEED_IMAGE_NAME" ]; then
            SEED_IMAGE_NAME="${{ inputs.image_name }}-seed-$INSTANCE_NAME"
          fi
          echo "SEED_IMAGE_NAME=$SEED_IMAGE_NAME" >> $GITHUB_ENV
          echo "PIHX_HOME=$RUNNER_TEMP/pihx" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'

      - name: Extract pom version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create instance
        env:
          OPENMRS_DISTRO_DIR: ${{ github.workspace }}
          OPENMRS_IMAGE_NAME: ${{ inputs.image_name }}
          OPENMRS_PIH_CONFIG: ${{ inputs.pih_config }}
        run: .openmrs-contrib-distro-tools/bin/openmrs-docker ${{ env.INSTANCE_NAME }} create

      - name: Start stack
        run: .openmrs-contrib-distro-tools/bin/openmrs-docker ${{ env.INSTANCE_NAME }} start --build

      - name: Wait for OpenMRS to be fully initialized
        run: .openmrs-contrib-distro-tools/bin/openmrs-docker ${{ env.INSTANCE_NAME }} wait

      - name: Stop OpenMRS
        run: docker stop "${{ env.INSTANCE_NAME }}-openmrs"

      - name: Export database
        run: |
          # The instance's root password, from its merged values.
          MYSQL_PASSWORD=$(.openmrs-contrib-distro-tools/bin/pihx "${{ env.INSTANCE_NAME }}" config --show-secrets |
            sed -n 's/^OPENMRS_DB_ROOT_PASSWORD=//p') \
            .openmrs-contrib-distro-tools/bin/openmrs-utils backup-mysqldump \
            --container="${{ env.INSTANCE_NAME }}-openmrs-db" --output=openmrs-db.sql.gz
          echo "openmrs-db.sql.gz size: $(du -sh openmrs-db.sql.gz | cut -f1)"

      - name: Export openmrs-data volume
        run: |
          .openmrs-contrib-distro-tools/bin/openmrs-utils backup-openmrs-data-directory \
            --volume="${{ env.INSTANCE_NAME }}_openmrs-data" --output=openmrs.tar.gz
          echo "openmrs.tar.gz size: $(du -sh openmrs.tar.gz | cut -f1)"

      # Its containers only, freeing the runner for the build; the runner (and its volumes) are
      # discarded after the job.
      - name: Stop instance
        if: always()
        run: .openmrs-contrib-distro-tools/bin/openmrs-docker ${{ env.INSTANCE_NAME }} stop

      # Named after the services they restore, as `initialize --from-image` takes them.
      - name: Build seed image
        run: |
          mkdir -p .seed-build-context
          cp openmrs-db.sql.gz openmrs.tar.gz .seed-build-context/
          docker build \
            -f .openmrs-contrib-distro-tools/openmrs/seed/Dockerfile \
            -t "${{ env.SEED_IMAGE_NAME }}:${{ env.VERSION }}" \
            -t "${{ env.SEED_IMAGE_NAME }}:latest" \
            .seed-build-context/

      - name: Push seed image
        run: |
          docker push "${{ env.SEED_IMAGE_NAME }}:${{ env.VERSION }}"
          docker push "${{ env.SEED_IMAGE_NAME }}:latest"

      - name: Clean up
        if: always()
        run: rm -rf openmrs-db.sql.gz openmrs.tar.gz .seed-build-context
