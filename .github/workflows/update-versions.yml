name: Update Versions

on:
  workflow_call:
    secrets:
      OPENMRS_MAVEN_USERNAME:
        required: true
      OPENMRS_MAVEN_PASSWORD:
        required: true
      GHA_WRITE_TOKEN:
        required: true

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"
      - name: Update versions
        run: mvn clean versions:update-properties -DallowSnapshots=true scm:checkin -Dmessage='automatic update of mvn version dependencies'
        env:
          OPENMRS_MAVEN_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OPENMRS_MAVEN_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
