name: Update Versions

on:
  workflow_call:
    inputs:
      allow-snapshots:
        description: >-
          Whether versions:update-properties may bump a property onto a
          SNAPSHOT version. When true (the default, for backwards
          compatibility), this applies to *every* property, including ones
          currently pinned to a stable release -- so a release-pinned
          dependency can get bumped onto an unreleased dev snapshot the
          moment one becomes available upstream. Set to false for repos
          that pin some dependencies to stable releases on purpose.
        default: true
        type: boolean
    secrets:
      OPENMRS_MAVEN_USERNAME:
        required: false
      OPENMRS_MAVEN_PASSWORD:
        required: false
      GHA_WRITE_TOKEN:
        required: true

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"
      - name: Update versions
        run: mvn clean versions:update-properties -DallowSnapshots=${{ inputs.allow-snapshots }} scm:checkin -Dmessage='automatic update of mvn version dependencies'
        env:
          OPENMRS_MAVEN_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OPENMRS_MAVEN_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
