name: Update Versions

on:
  workflow_call:
    secrets:
      OPENMRS_MAVEN_USERNAME:
        required: false
      OPENMRS_MAVEN_PASSWORD:
        required: false
      GHA_WRITE_TOKEN:
        required: true

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"
      # No -DallowSnapshots flag: Maven's own default (false) applies, so this
      # only ever bumps a property between stable releases, never onto an
      # unreleased SNAPSHOT -- regardless of whether the property is
      # currently pinned to a release or already tracking a snapshot. A repo
      # that wants snapshot-tracking can opt in via its own pom.xml
      # (versions-maven-plugin <configuration><allowSnapshots>true</...>),
      # which -D would override anyway, so leaving it off here doesn't
      # prevent that -- it just stops this workflow from silently deciding
      # it for every repo.
      - name: Update versions
        run: mvn clean versions:update-properties scm:checkin -Dmessage='automatic update of mvn version dependencies'
        env:
          OPENMRS_MAVEN_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OPENMRS_MAVEN_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}
