name: Release new version

on:
  workflow_call:
    inputs:
      image_name:
        description: OpenMRS image name, without tag. Omit to skip building/pushing a Docker image (eg. for module repos with no distro to build).
        required: false
        type: string
        default: ''
      maven_profiles:
        description: Comma-separated Maven profiles to activate during release:perform (e.g. distro-zip)
        required: false
        type: string
        default: ''
    secrets:
      OPENMRS_MAVEN_USERNAME:
        required: true
      OPENMRS_MAVEN_PASSWORD:
        required: true
      GHA_WRITE_TOKEN:
        required: true
      DOCKERHUB_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
          server-id: openmrs-repo-modules-pih
          server-username: OPENMRS_MAVEN_USERNAME
          server-password: OPENMRS_MAVEN_PASSWORD

      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"

      - name: Maven Release Prepare and Perform
        run: mvn -B -DpreparationGoals=clean -Darguments="-Dmaven.test.skip=true" release:prepare release:perform --file pom.xml${{ inputs.maven_profiles != '' && format(' -DreleaseProfiles={0}', inputs.maven_profiles) || '' }}
        env:
          OPENMRS_MAVEN_USERNAME: ${{ secrets.OPENMRS_MAVEN_USERNAME }}
          OPENMRS_MAVEN_PASSWORD: ${{ secrets.OPENMRS_MAVEN_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GHA_WRITE_TOKEN }}

      # release:perform builds the release under target/checkout (it never touches the working
      # copy's own target/), so the distro assembly - and the Docker context below - live there too.
      - name: Extract released version
        if: inputs.image_name != ''
        run: echo "DOCKER_IMAGE_TAG_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --file target/checkout/pom.xml)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: inputs.image_name != ''
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/build-and-push-docker@main
        with:
          image_name: ${{ inputs.image_name }}
          context: target/checkout/distro/target/distro/web
          version: ${{ env.DOCKER_IMAGE_TAG_VERSION }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
