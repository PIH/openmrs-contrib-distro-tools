name: Release new version

on:
  workflow_call:
    inputs:
      image_name:
        description: OpenMRS image name, without tag. Omit to skip building/pushing a Docker image (eg. for module repos with no distro to build).
        required: false
        type: string
        default: ''
      maven_profiles:
        description: Comma-separated additional Maven profiles to activate during release:perform (e.g. distro-zip), alongside the release profile
        required: false
        type: string
        default: ''
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      SONATYPE_GPG_PASSPHRASE:
        required: true
      SONATYPE_GPG_PRIVATE_KEY:
        required: true
      DOCKERHUB_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
          server-id: central
          server-username: MAVEN_DEPLOY_USERNAME
          server-password: MAVEN_DEPLOY_PASSWORD

      - name: Setup Git Config
        run: |
          git config user.name "Github Action"
          git config user.email "github-action@users.noreply.github.com"

      - name: Deploy release
        run: mvn -B release:prepare release:perform -Prelease${{ inputs.maven_profiles != '' && format(',{0}', inputs.maven_profiles) || '' }} --file pom.xml
        env:
          MAVEN_DEPLOY_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_DEPLOY_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release:perform builds the release under target/checkout (it never touches the working
      # copy's own target/), so the distro assembly - and the Docker context below - live there too.
      - name: Extract released version
        if: inputs.image_name != ''
        id: released-version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --file target/checkout/pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image (released version)
        if: inputs.image_name != ''
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/build-and-push-docker@main
        with:
          image_name: ${{ inputs.image_name }}
          context: target/checkout/distro/target/distro/web
          version: ${{ steps.released-version.outputs.version }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # release:prepare only bumps the working copy to the next SNAPSHOT and commits/pushes it -
      # it never deploys that snapshot itself. That push also doesn't trigger the push-based
      # snapshot workflow: it's pushed using the default GITHUB_TOKEN (via actions/checkout above),
      # and GitHub's own loop-prevention means GITHUB_TOKEN-authored pushes never trigger other
      # workflow runs. So deploy the new next-development-version snapshot explicitly here instead.
      # Unlike the release above, this is a plain deploy - no GPG signing, since Sonatype doesn't
      # require signed snapshots.
      - name: Deploy next development version
        id: next-snapshot
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/maven-deploy@main
        with:
          maven_profiles: ${{ inputs.maven_profiles }}
          username: ${{ secrets.SONATYPE_USERNAME }}
          password: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Build and Push Docker Image (next snapshot)
        if: inputs.image_name != ''
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/build-and-push-docker@main
        with:
          image_name: ${{ inputs.image_name }}
          context: distro/target/distro/web
          version: ${{ steps.next-snapshot.outputs.version }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
