name: Deploy via self-hosted runner

# No use of the GitHub API or GITHUB_TOKEN here (no checkout, nothing pushed
# back) -- deny all default token permissions so a compromised job on this
# self-hosted runner can't use it for anything.
permissions: {}

on:
  workflow_call:
    inputs:
      runner-label:
        description: 'Label of the self-hosted runner on the target host'
        required: true
        type: string
      puppet-manifest:
        description: "Manifest to apply, passed to puppet-apply.sh (e.g. 'site' or 'petl')"
        default: 'site'
        type: string
      run-etl:
        description: 'Whether to run the full ETL job after the puppet apply'
        default: false
        type: boolean
      notify_ci_dashboard:
        description: Notify PIH/ci-dashboard via repository_dispatch when this job starts and finishes
        required: false
        type: boolean
        default: false

jobs:
  notify-started:
    if: inputs.notify_ci_dashboard == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (deploy started)
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: started

  deploy:
    needs: notify-started
    if: always()
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    steps:
      # Deploys can be paused on a host (e.g. during maintenance or a demo) by
      # creating /etc/puppet/build-disabled, optionally containing a reason,
      # and resumed by deleting it. The job still succeeds, with a warning.
      # The reason is shown in this job's log, which may be public.
      - name: Check for build-disabled flag
        id: gate
        run: |
          FLAG=/etc/puppet/build-disabled
          if [ -e "$FLAG" ]; then
            REASON=$(cat "$FLAG" 2>/dev/null | tr '\n' ' ')
            SINCE=$(date -r "$FLAG" '+%Y-%m-%d %H:%M %Z')
            echo "::warning::Deploy skipped: $FLAG present on ${{ inputs.runner-label }} since ${SINCE}. ${REASON:-No reason given.} Delete the file to resume."
            echo "disabled=true" >> "$GITHUB_OUTPUT"
          fi
      # Output is deliberately not streamed to this step's log: puppet-apply.sh
      # runs with Puppet's -v -d flags, which can echo decrypted secrets
      # (resource parameters, exec commands, etc.) to console, and this job
      # runs in the context of whichever repo called this workflow -- often a
      # public one. puppet-apply.sh already writes its own log (console +
      # syslog + a dated file under /var/log/mirebalais-puppet) on the host
      # itself, which stays behind the same VPN-only access as before this
      # migration; check there for failure details.
      - name: Puppet apply
        if: steps.gate.outputs.disabled != 'true'
        run: |
          MSG="puppet-apply.sh ${{ inputs.puppet-manifest }}: full log is at /var/log/mirebalais-puppet on the host (VPN access required); not shown here since it may contain secrets."
          cd /etc/puppet
          sudo git pull > /dev/null
          if sudo ./puppet-apply.sh ${{ inputs.puppet-manifest }} > /dev/null 2>&1; then
            echo "Succeeded. ${MSG}"
          else
            echo "::error::Failed. ${MSG}"
            exit 1
          fi
      - name: Run full ETL
        if: ${{ inputs.run-etl && steps.gate.outputs.disabled != 'true' }}
        timeout-minutes: 60
        run: |
          MSG="execute-full.sh: full log is at /var/log/petl.log on the host (VPN access required); not shown here since it may contain secrets."
          cd /opt/petl/bin
          if sudo ./execute-full.sh > /dev/null 2>&1; then
            echo "Succeeded. ${MSG}"
          else
            echo "::error::Failed. ${MSG}"
            exit 1
          fi

  notify-ci-dashboard:
    needs: deploy
    if: always() && inputs.notify_ci_dashboard == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify ci-dashboard (deploy finished)
        continue-on-error: true
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/notify-ci-dashboard@main
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          phase: finished
