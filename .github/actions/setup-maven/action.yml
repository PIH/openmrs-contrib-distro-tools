name: Set up Maven
description: Puts a pinned Maven on the PATH ahead of the runner's own. Releases to Central need Maven 3.9.x for now - under Maven 3.10, central-publishing-maven-plugin 0.11.0 bundles local-repository files (maven-metadata-local.xml, _remote.repositories) that the Central Portal rejects.

inputs:
  version:
    description: Maven version to install
    required: false
    default: '3.9.16'
  sha512:
    description: SHA-512 of apache-maven-<version>-bin.tar.gz, from archive.apache.org
    required: false
    default: '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6'

runs:
  using: composite
  steps:
    - name: Install Maven ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA512: ${{ inputs.sha512 }}
      run: |
        archive="apache-maven-${VERSION}-bin.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://archive.apache.org/dist/maven/maven-3/${VERSION}/binaries/${archive}"
        echo "${SHA512}  $RUNNER_TEMP/$archive" | sha512sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-${VERSION}/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/apache-maven-${VERSION}/bin/mvn" -v
