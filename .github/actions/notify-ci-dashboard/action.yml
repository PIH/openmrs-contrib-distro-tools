name: Notify ci-dashboard
description: Fires a repository_dispatch to PIH/ci-dashboard so it can refresh near-real-time, naming this repo as the trigger

inputs:
  token:
    description: Token with repository_dispatch rights on PIH/ci-dashboard
    required: true
  phase:
    description: "started or finished — used only in the step name for readability in logs"
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch (${{ inputs.phase }})
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ inputs.token }}
        repository: PIH/ci-dashboard
        event-type: build-status-changed
        client-payload: '{"repo": "${{ github.event.repository.name }}"}'
