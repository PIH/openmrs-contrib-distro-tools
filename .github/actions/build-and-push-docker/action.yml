name: Build and Push Docker Image
description: Builds a (by default multi-arch) Docker image from the given build context and pushes it to Docker Hub, tagged 'latest' and with the given version. Optionally builds and pushes additional images from the same context on variants of the base image (e.g. different Java versions).

inputs:
  image_name:
    description: Docker Hub image name, without tag
    required: true
  context:
    description: Docker build context directory (e.g. a built distro/web directory)
    required: true
  version:
    description: Version to tag the image with, in addition to 'latest'
    required: true
  dockerhub_password:
    description: Docker Hub password for the pihci account
    required: true
  platforms:
    description: Comma-separated platforms to build for
    required: false
    default: linux/amd64,linux/arm64
  image_variants:
    description: |
      Optional additional images to build from the same context on variants of the base image, one per line as
      <image name>=<base image variant>, e.g. partnersinhealth/zl-emr-java8=amazoncorretto-8. The variant replaces the
      Dockerfile's default BASE_IMAGE_VARIANT (2.8.9 becomes 2.8.9-amazoncorretto-8); leave it empty after the = to use
      the default variant (plain 2.8.9). Each image is tagged the same as image_name. Requires a Dockerfile generated by
      openmrs-sdk with SDK-404.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: pihci
        password: ${{ inputs.dockerhub_password }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: true
        platforms: ${{ inputs.platforms }}
        tags: |
          ${{ inputs.image_name }}:latest
          ${{ inputs.image_name }}:${{ inputs.version }}

    - name: Build and Push Variant Docker Images
      if: inputs.image_variants != ''
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        IMAGE_VARIANTS: ${{ inputs.image_variants }}
        PLATFORMS: ${{ inputs.platforms }}
        VERSION: ${{ inputs.version }}
      run: |
        dockerfile="$CONTEXT/Dockerfile"
        if ! grep -q '^ARG BASE_IMAGE_VARIANT=' "$dockerfile"; then
          echo "::error::$dockerfile has no 'ARG BASE_IMAGE_VARIANT=' line; building variant images requires a Dockerfile generated by openmrs-sdk with SDK-404"
          exit 1
        fi
        # Validate every line before building, so a bad entry doesn't leave only some variants pushed
        images=()
        variants=()
        while IFS= read -r line; do
          [ -z "$(echo "$line" | xargs)" ] && continue
          if [[ "$line" != *=* ]]; then
            echo "::error::Invalid image_variants line '$line' (expected <image name>=<base image variant>, with an empty variant for the default)"
            exit 1
          fi
          image=$(echo "${line%%=*}" | xargs)
          if [ -z "$image" ]; then
            echo "::error::No image name given in image_variants line '$line'"
            exit 1
          fi
          images+=("$image")
          variants+=("$(echo "${line#*=}" | xargs)")
        done <<< "$IMAGE_VARIANTS"
        for i in "${!images[@]}"; do
          image=${images[$i]}
          variant=${variants[$i]}
          echo "::group::$image (BASE_IMAGE_VARIANT='$variant')"
          docker buildx build "$CONTEXT" --push --platform "$PLATFORMS" \
            --build-arg "BASE_IMAGE_VARIANT=$variant" \
            --tag "$image:latest" --tag "$image:$VERSION"
          echo "::endgroup::"
        done
