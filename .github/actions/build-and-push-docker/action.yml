name: Build and Push Docker Image
description: Builds a (by default multi-arch) Docker image from the given build context and pushes it to Docker Hub, tagged 'latest' and with the given version. Optionally builds and pushes additional tags of the same image from the same context on variants of the base image (e.g. different Java versions).

inputs:
  image_name:
    description: Docker Hub image name, without tag
    required: true
  context:
    description: Docker build context directory (e.g. a built distro/web directory)
    required: true
  version:
    description: Version to tag the image with, in addition to 'latest'
    required: true
  dockerhub_password:
    description: Docker Hub password for the pihci account
    required: true
  platforms:
    description: Comma-separated platforms to build for
    required: false
    default: linux/amd64,linux/arm64
  image_variants:
    description: |
      Optional additional tags of image_name to build from the same context on variants of the base image, one per line
      as <tag suffix>=<base image variant>, e.g. java8=amazoncorretto-8. Each is pushed as image_name:latest-<suffix> and
      image_name:<version>-<suffix>. The variant replaces the Dockerfile's default BASE_IMAGE_VARIANT (2.8.9 becomes
      2.8.9-amazoncorretto-8); leave it empty after the = to use the default variant (plain 2.8.9). Requires a Dockerfile
      generated by openmrs-sdk with SDK-404.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Logged in first, so the QEMU and Buildx set-up images pull as pihci, not anonymously (rate limited).
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: pihci
        password: ${{ inputs.dockerhub_password }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        push: true
        platforms: ${{ inputs.platforms }}
        tags: |
          ${{ inputs.image_name }}:latest
          ${{ inputs.image_name }}:${{ inputs.version }}

    - name: Build and Push Variant Docker Images
      if: inputs.image_variants != ''
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_VARIANTS: ${{ inputs.image_variants }}
        PLATFORMS: ${{ inputs.platforms }}
        VERSION: ${{ inputs.version }}
      run: |
        dockerfile="$CONTEXT/Dockerfile"
        if ! grep -q '^ARG BASE_IMAGE_VARIANT=' "$dockerfile"; then
          echo "::error::$dockerfile has no 'ARG BASE_IMAGE_VARIANT=' line; building variant images requires a Dockerfile generated by openmrs-sdk with SDK-404"
          exit 1
        fi
        # Validate every line before building, so a bad entry doesn't leave only some variants pushed
        suffixes=()
        variants=()
        while IFS= read -r line; do
          [ -z "$(echo "$line" | xargs)" ] && continue
          if [[ "$line" != *=* ]]; then
            echo "::error::Invalid image_variants line '$line' (expected <tag suffix>=<base image variant>, with an empty variant for the default)"
            exit 1
          fi
          suffix=$(echo "${line%%=*}" | xargs)
          if [[ ! "$suffix" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "::error::Invalid tag suffix '$suffix' in image_variants line '$line' (letters, digits, '_', '.' and '-' only)"
            exit 1
          fi
          for existing in "${suffixes[@]}"; do
            if [ "$existing" = "$suffix" ]; then
              echo "::error::Tag suffix '$suffix' is used more than once in image_variants"
              exit 1
            fi
          done
          suffixes+=("$suffix")
          variants+=("$(echo "${line#*=}" | xargs)")
        done <<< "$IMAGE_VARIANTS"
        for i in "${!suffixes[@]}"; do
          suffix=${suffixes[$i]}
          variant=${variants[$i]}
          echo "::group::$IMAGE_NAME:*-$suffix (BASE_IMAGE_VARIANT='$variant')"
          docker buildx build "$CONTEXT" --push --platform "$PLATFORMS" \
            --build-arg "BASE_IMAGE_VARIANT=$variant" \
            --tag "$IMAGE_NAME:latest-$suffix" --tag "$IMAGE_NAME:$VERSION-$suffix"
          echo "::endgroup::"
        done
