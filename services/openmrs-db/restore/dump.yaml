# initialize, openmrs-db.sql or openmrs-db.sql.gz: mounts the dump where MySQL's entrypoint imports
# it on first start.

services:
  openmrs-db:
    volumes:
      - ${OPENMRS_DB_RESTORE_PATH:?OPENMRS_DB_RESTORE_PATH must be set}:/docker-entrypoint-initdb.d/${OPENMRS_DB_RESTORE_NAME:?OPENMRS_DB_RESTORE_NAME must be set}:ro

x-pihx:
  # The database isn't empty, so OpenMRS mustn't create its tables (see the openmrs service).
  env:
    OPENMRS_DB_CREATED_EMPTY: "false"
