services:
  openmrs-db:
    container_name: ${SERVICE_NAME}-openmrs-db
    image: ${OPENMRS_DB_IMAGE_NAME}:${OPENMRS_DB_IMAGE_TAG}
    # Every OPENMRS_DB_OPT_<option> variable becomes a --<option>=<value> server flag (`_` becomes
    # `-`, which MySQL and MariaDB treat the same in option names); an empty value gives a bare
    # --<option>, e.g. OPENMRS_DB_OPT_skip_name_resolve=. Anything not set is the server's own
    # default. The defaults are in env.defaults; an instance's own are in its openmrs-db.env.
    # The image's own entrypoint then does its usual first-boot setup.
    entrypoint:
      - bash
      - -c
      - |
        args=()
        for var in $${!OPENMRS_DB_OPT_@}; do
          opt=$${var#OPENMRS_DB_OPT_}
          opt=$${opt//_/-}
          if [ -n "$${!var}" ]; then args+=("--$$opt=$${!var}"); else args+=("--$$opt"); fi
        done
        [ $${#args[@]} -gt 0 ] || echo "No OPENMRS_DB_OPT_* variables set: starting with the server's own defaults" >&2
        server=mariadbd
        command -v mariadbd >/dev/null || server=mysqld
        # Before a mysql image sets up an empty data directory: it puts the passwords into SQL
        # unescaped (a backslash in the root password fails the setup, and the openmrs user gets a
        # different password). MariaDB's images escape them, and OpenMRS reads either correctly
        # (openmrs-core 2.8.11+, TRUNK-6835). An existing data directory isn't checked: its accounts
        # were set by other means (e.g. openmrs-db reset-accounts).
        if [ "$$server" = mysqld ] && [ -z "$$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
          case "$$MYSQL_PASSWORD" in *\\*) bad=OPENMRS_DB_PASSWORD ;; esac
          case "$$MYSQL_ROOT_PASSWORD" in *\\*) bad=OPENMRS_DB_ROOT_PASSWORD ;; esac
          if [ -n "$${bad:-}" ]; then
            echo "error: $$bad contains a backslash, which this MySQL image's first setup gets wrong. Choose a password without one, or use a MariaDB image." >&2
            exit 1
          fi
        fi
        exec docker-entrypoint.sh "$$server" "$${args[@]}"
    env_file:
      - path: ${PIHX_TOOLS}/services/openmrs-db/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/openmrs-db.env
        required: false
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - ${OPENMRS_DB_PORT}:3306
    volumes:
      - db-data:/var/lib/mysql
      # The host's current time zone data: mysql:5.6's is out of date (e.g. Mexico City).
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      # The password from the container's own environment, in MYSQL_PWD, so it's on no command line
      # (the host's ps shows healthcheck processes). TCP, so it only passes once the real server runs.
      # MariaDB 11+ images have only the mariadb client.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" \"$$(command -v mysql || command -v mariadb)\" -h 127.0.0.1 -u \"$$MYSQL_USER\" openmrs -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENMRS_DB_MEMORY_LIMIT}

  # Makes sure the MySQL accounts declared in env as OPENMRS_DB_ACCOUNT_<ID>_* exist, with those
  # passwords, grants and databases (scripts/ensure-mysql-accounts.sh). Runs on every
  # start, and first for any service that depends on it, so a restored or rotated database gets them.
  openmrs-db-accounts:
    container_name: ${SERVICE_NAME}-openmrs-db-accounts
    image: ${OPENMRS_DB_IMAGE_NAME}:${OPENMRS_DB_IMAGE_TAG}
    depends_on:
      openmrs-db:
        condition: service_healthy
    entrypoint: ["bash", "/ensure-mysql-accounts.sh"]
    # The accounts declared in openmrs-db.env as OPENMRS_DB_ACCOUNT_<ID>_*; other services add theirs
    # in their with-openmrs-db.yaml.
    env_file:
      - path: ${PIHX_TOOLS}/services/openmrs-db/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/openmrs-db.env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD}
      OPENMRS_DB_USER: ${OPENMRS_DB_USER}
    volumes:
      - ${PIHX_TOOLS}/services/openmrs-db/scripts/ensure-mysql-accounts.sh:/ensure-mysql-accounts.sh:ro
      - ${PIHX_TOOLS}/services/openmrs-db/scripts/mysql-accounts.sh:/mysql-accounts.sh:ro
    restart: "no"

# External, named as Compose named them: pihx creates them (pihx/volumes.py) and only `pihx
# <instance> destroy` removes them, so no `docker compose down -v` can delete them.
volumes:
  db-data:
    external: true
    name: ${SERVICE_NAME}_db-data
