services:
  dhis2-db:
    container_name: ${SERVICE_NAME}-dhis2-db
    image: ${DHIS2_DB_IMAGE_NAME}:${DHIS2_DB_IMAGE_TAG}
    # Every DHIS2_DB_OPT_<parameter> variable becomes a -c <parameter>=<value> server flag. Anything
    # not set is the server's own default. The defaults are in env.defaults; an instance's own are in
    # its dhis2-db.env. The image's own entrypoint then does its usual first-boot setup, including
    # the PostGIS extension.
    entrypoint:
      - bash
      - -c
      - |
        args=()
        for var in $${!DHIS2_DB_OPT_@}; do
          args+=(-c "$${var#DHIS2_DB_OPT_}=$${!var}")
        done
        [ $${#args[@]} -gt 0 ] || echo "No DHIS2_DB_OPT_* variables set: starting with the server's own defaults" >&2
        exec docker-entrypoint.sh postgres "$${args[@]}"
    env_file:
      - path: ${PIHX_TOOLS}/services/dhis2-db/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/dhis2-db.env
        required: false
    environment:
      POSTGRES_DB: ${DHIS2_DB_NAME}
      POSTGRES_USER: ${DHIS2_DB_USER}
      POSTGRES_PASSWORD: ${DHIS2_DB_PASSWORD:?DHIS2_DB_PASSWORD must be set (the password of the DHIS2 database account)}
      TZ: ${TZ}
    ports:
      - ${DHIS2_DB_PORT}:5432
    volumes:
      - dhis2-db-data:/var/lib/postgresql/data
    healthcheck:
      # The password from the container's own environment, in PGPASSWORD, so it's on no command line.
      # TCP, so it only passes once the real server runs: during first-boot setup (and a restore's
      # import) the image's entrypoint runs a temporary server that listens on the socket only.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${DHIS2_DB_MEMORY_LIMIT}

# External, named as Compose named them: pihx creates them (pihx/volumes.py) and only `pihx
# <instance> destroy` removes them, so no `docker compose down -v` can delete them.
volumes:
  dhis2-db-data:
    external: true
    name: ${SERVICE_NAME}_dhis2-db-data
