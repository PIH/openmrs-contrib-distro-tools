# initialize, dhis2.7z, .tar.gz, .tgz, .tar or .zip: extracts it into dhis2-data, through a staging
# directory in the volume so the last step is a rename. A single top-level directory (as the backup
# makes, dhis2/) is unwrapped, so files/ and apps/ end up at the top of the volume, as in a legacy
# DHIS2 home.

services:
  restore-dhis2-data-volume:
    image: ${P7ZIP_IMAGE:?P7ZIP_IMAGE must be set}
    container_name: ${SERVICE_NAME}-restore-dhis2-data-volume
    environment:
      - ARCHIVE_PASSWORD
      - ARCHIVE_NAME=${DHIS2_RESTORE_ARCHIVE:?DHIS2_RESTORE_ARCHIVE must be set}
    volumes:
      # Long syntax: a missing source fails, instead of Docker creating an empty directory.
      - type: bind
        source: ${DHIS2_RESTORE_PATH:?DHIS2_RESTORE_PATH must be set}
        target: /source/${DHIS2_RESTORE_ARCHIVE:?DHIS2_RESTORE_ARCHIVE must be set}
        read_only: true
        bind:
          create_host_path: false
      - ${PIHX_TOOLS}/utils/lib/in-container/extract.sh:/extract.sh:ro
      - dhis2-data:/target
    command:
      - sh
      - -c
      - |
        set -e
        STAGING=/target/.restore-staging
        ROOT=$$(sh /extract.sh "/source/$$ARCHIVE_NAME" "$$STAGING" --print-root)
        find "$$ROOT" -mindepth 1 -maxdepth 1 -exec mv {} /target/ \;
        rm -rf "$$STAGING"
