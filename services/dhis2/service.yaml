description: DHIS2, in the stock Tomcat for its Java, with its release WAR fetched and verified by its setup
requires: [dhis2-db]
# dhis.conf settings, set when the instance is created, as DHIS2_CONF_<key> (scripts/setup.sh).
capture-env: [DHIS2_CONF_]
# Run before every start of dhis2.
setup: [dhis2-setup, dhis2-test-copy]
backup: scripts/backup.sh
# initialize: dhis2-data from an archive named after the service (restore/archive.yaml).
restore:
  - names: [dhis2.7z, dhis2.tar.gz, dhis2.tgz, dhis2.tar, dhis2.zip]
    overlay: restore/archive.yaml
