description: DHIS2, in the stock Tomcat for its Java, with its release WAR fetched and verified by its setup
requires: [dhis2-db]
# dhis.conf settings, set when the instance is created, as DHIS2_CONF_<key> (scripts/setup.sh).
capture-env: [DHIS2_CONF_]
# Runs before every start of dhis2.
setup: [dhis2-setup]
