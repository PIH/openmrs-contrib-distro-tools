services:
  # Runs the backup and upload jobs on their schedules (scripts/entrypoint.sh), with the instance
  # running. What each of the instance's services backs up comes from its with-backups.yaml, which
  # mounts its scripts directory at /opt/backup-services/<svc> (its backup script is backup.sh there)
  # and passes what that script needs.
  backups:
    container_name: ${SERVICE_NAME}-backups
    # Built in this repo (images/backup-tools), referenced by its content tag. A content tag never
    # changes, so it's only pulled when missing; pihx builds it when it isn't published yet.
    image: ${PIHX_IMAGE_BACKUP_TOOLS:?PIHX_IMAGE_BACKUP_TOOLS must be set (pihx sets it)}
    pull_policy: missing
    entrypoint: ["bash", "/opt/backup/entrypoint.sh"]
    # Its BACKUP_* are set in backups.env.
    env_file:
      - path: ${PIHX_TOOLS}/services/backups/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/backups.env
        required: false
    environment:
      BACKUP_ARCHIVE_PASSWORD: "${BACKUP_ARCHIVE_PASSWORD:?must be set: the password the backup archives are encrypted with}"
      BACKUP_PREFIX: ${BACKUP_PREFIX:-${SERVICE_NAME}}
      # What each of the instance's services backs up (pihx sets it from their manifests):
      # <svc>=script, <svc>=none (nothing to back up) or <svc>=unset (not backed up).
      BACKUP_PLAN: ${PIHX_BACKUP_PLAN}
      TZ: ${TZ}
    volumes:
      - backups:/backups
      # Directories, never single files: git replaces a file it updates, and a file mount would keep the
      # old one until the container restarts. A directory mount sees the update.
      - ${PIHX_TOOLS}/services/backups/scripts:/opt/backup:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKUP_MEMORY_LIMIT}

# External, named as Compose would name it: pihx creates it (pihx/volumes.py), and `pihx <instance>
# destroy` keeps it unless given --include-backups, so the runs in it outlive the instance.
volumes:
  backups:
    external: true
    name: ${SERVICE_NAME}_backups
