# AdvaPACS's on-premises gateway: receives DICOM (and optionally HL7) from local modalities and
# uploads it to the AdvaPACS cloud, over outbound HTTPS only. Independent of openhim.
#
# It uses the host's network, as AdvaPACS's Docker install guide does
# (https://docs.advapacs.com/getting-started/connect-modalities/install-the-gateway/docker): "Using
# host networking allows any Local AEs created on the Gateway to be directly accessible from other
# devices on your network without additional Docker port mappings." Its listening ports (Local AEs,
# HL7 inbound services) are set in the AdvaPACS UI and pushed to the gateway, so a port configured
# there works without changing this instance. The guide allows bridge networking instead, publishing
# the DICOM ports by hand; we don't, since each port would then also have to be set here.
#
# That makes it the one service outside the instance's Docker network, by our choice. What follows
# from host networking (not from the guide, which doesn't cover these): its ports are the host's, so
# two gateways on one host clash unless their Local AEs and HL7 services are given different ports in
# AdvaPACS; the host's firewall, not a published port, decides who reaches them; and the instance's
# other containers reach it through the host (host.docker.internal), not by its service name. Our
# convention: record the ports each instance's gateway is configured with where the instance is
# defined (e.g. puppet's site.pp).
#
# No healthcheck: the gateway has no HTTP endpoint, and opens no port until AdvaPACS has sent it its
# configuration (and then the ports AdvaPACS says), so there's nothing fixed to check. AdvaPACS
# shows whether it's Online (Configuration > Gateways).
#
# The data directory (received studies, the upload queue, the embedded database) is the image's
# default, /opt/AdvaHealthSolutions/AdvaPACSGateway. Leave the gateway's Data Directory in AdvaPACS
# at that path, or the data lands outside the volume.
services:
  advapacs-gateway:
    container_name: ${SERVICE_NAME}-advapacs-gateway
    image: ${ADVAPACS_GATEWAY_IMAGE_NAME}:${ADVAPACS_GATEWAY_IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ${PIHX_TOOLS}/services/advapacs-gateway/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/advapacs-gateway.env
        required: false
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${ADVAPACS_GATEWAY_JAVA_OPTS}
      # Prefixed ADVAPACS_GATEWAY_* in the instance's env, passed to the gateway under the names it
      # reads. No defaults: the instance must set them, from AdvaPACS (Configuration > Gateways).
      ADVAPACS_REGION: "${ADVAPACS_GATEWAY_REGION:?must be set: the region of the gateway, from AdvaPACS (Configuration > Gateways)}"
      ADVAPACS_ACCESS_KEY_ID: "${ADVAPACS_GATEWAY_ACCESS_KEY_ID:?must be set: the access key ID of the gateway, from AdvaPACS (Configuration > Gateways)}"
      ADVAPACS_ACCESS_KEY_SECRET: "${ADVAPACS_GATEWAY_ACCESS_KEY_SECRET:?must be set: the access key secret of the gateway, from AdvaPACS (Configuration > Gateways)}"
    volumes:
      - advapacs-gateway-data:/opt/AdvaHealthSolutions/AdvaPACSGateway
    deploy:
      resources:
        limits:
          memory: ${ADVAPACS_GATEWAY_MEMORY_LIMIT}

# External, named as Compose named them: pihx creates them (pihx/volumes.py) and only `pihx
# <instance> destroy` removes them, so no `docker compose down -v` can delete them.
volumes:
  advapacs-gateway-data:
    external: true
    name: ${SERVICE_NAME}_advapacs-gateway-data
