# The AdvaPACS radiology-order mediator. Needs the openhim service: it registers with openhim-core,
# which routes to it.
#
# Don't rename the service: the mediator's mediatorConfig.json (in its image) routes its channel to
# the host openhim-advapacs-mediator, which is this service's name on the instance's network.
services:
  openhim-advapacs-mediator:
    container_name: ${SERVICE_NAME}-openhim-advapacs-mediator
    image: ${ADVAPACS_MEDIATOR_IMAGE_NAME}:${ADVAPACS_MEDIATOR_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      openhim-core:
        condition: service_healthy
      openhim-setup:
        condition: service_completed_successfully
    env_file:
      - path: ${PIHX_TOOLS}/services/openhim-advapacs-mediator/env.defaults
      - path: ${PIHX_INSTANCE_DIR}/openhim-advapacs-mediator.env
        required: false
    extra_hosts:
      # For an OpenMRS running on the host rather than in this instance
      # (ADVAPACS_MEDIATOR_OPENMRS_BASE_URL=http://host.docker.internal:8080/openmrs).
      - "host.docker.internal:host-gateway"
    environment:
      # openhim-core by service name, over plain HTTP (see openhim.yaml).
      OPENHIM_API_URL: http://openhim-core:8080
      OPENHIM_ROUTER_URL: http://openhim-core:5001
      ADVAPACS_CHANNEL_URL: http://openhim-core:5001/advapacs
      MEDIATOR_PORT: "3500"
      # OpenHIM's own, which the openhim service owns.
      OPENHIM_USERNAME: ${OPENHIM_USERNAME}
      OPENHIM_PASSWORD: "${OPENHIM_PASSWORD:?must be set: the password for OpenHIM's admin account (the openhim service's)}"
      # The rest are the mediator's own, all prefixed ADVAPACS_MEDIATOR_* in the instance's env (so
      # none looks like another service's, e.g. openmrs's OPENMRS_*), passed to the mediator under the
      # names it reads.
      LOG_LEVEL: ${ADVAPACS_MEDIATOR_LOG_LEVEL}
      MEDIATOR_INBOUND_SECRET: "${ADVAPACS_MEDIATOR_INBOUND_SECRET:?must be set: the shared secret on the order requests the mediator's poller sends it through OpenHIM}"
      ORDER_INGESTION_MODE: ${ADVAPACS_MEDIATOR_ORDER_INGESTION_MODE}
      ORDER_POLL_INTERVAL_MS: ${ADVAPACS_MEDIATOR_ORDER_POLL_INTERVAL_MS}
      OPENHIM_INBOUND_CLIENT_ID: ${ADVAPACS_MEDIATOR_OPENHIM_INBOUND_CLIENT_ID}
      OPENHIM_INBOUND_CLIENT_PASSWORD: "${ADVAPACS_MEDIATOR_OPENHIM_INBOUND_CLIENT_PASSWORD:?must be set: the password of the OpenHIM client the mediator's order poller uses}"
      # OpenMRS's FHIR API, which the mediator polls for orders and writes results to.
      OPENMRS_BASE_URL: ${ADVAPACS_MEDIATOR_OPENMRS_BASE_URL}
      OPENMRS_FHIR_PATH: ${ADVAPACS_MEDIATOR_OPENMRS_FHIR_PATH}
      OPENMRS_USERNAME: "${ADVAPACS_MEDIATOR_OPENMRS_USERNAME:?must be set: the OpenMRS account the mediator uses}"
      OPENMRS_PASSWORD: "${ADVAPACS_MEDIATOR_OPENMRS_PASSWORD:?must be set: the password of the OpenMRS account the mediator uses}"
      # AdvaPACS's FHIR API. The mediator reaches it through OpenHIM (ADVAPACS_CHANNEL_URL); the base URL
      # is the real host, which the mediator sets as its channel's route when it registers.
      ADVAPACS_BASE_URL: ${ADVAPACS_MEDIATOR_ADVAPACS_BASE_URL}
      ADVAPACS_CLIENT_ID: "${ADVAPACS_MEDIATOR_ADVAPACS_CLIENT_ID:?must be set: the mediator's AdvaPACS API client ID}"
      ADVAPACS_CLIENT_SECRET: "${ADVAPACS_MEDIATOR_ADVAPACS_CLIENT_SECRET:?must be set: the mediator's AdvaPACS API client secret}"
      # AdvaPACS's study and report webhook: the password of the OpenHIM client AdvaPACS calls it as.
      # Unset, the webhook accepts no one.
      ADVAPACS_WEBHOOK_SECRET: ${ADVAPACS_MEDIATOR_ADVAPACS_WEBHOOK_SECRET}
      # Results to OpenMRS (radiologyapp studies and reports). The mediator hands each webhook event to
      # OpenHIM, which retries it, and calls radiologyapp through its own private OpenHIM channel,
      # both on openhim-core like the others. Without the results client password, webhook events get
      # a 503 and no results are written.
      OPENMRS_RESULTS_CHANNEL_URL: http://openhim-core:5001/openmrs
      OPENHIM_RESULTS_CLIENT_PASSWORD: ${ADVAPACS_MEDIATOR_OPENHIM_RESULTS_CLIENT_PASSWORD}
      # The uuid of the OpenMRS patient identifier type that ADVAPACS_PATIENT_IDENTIFIER_SYSTEM stands
      # for, used to check a result's patient against the order's.
      OPENMRS_PATIENT_IDENTIFIER_TYPE_UUID: ${ADVAPACS_MEDIATOR_PATIENT_IDENTIFIER_TYPE_UUID}
      # Optional: the identifier systems of the accession number and the placer order number. Empty,
      # the mediator's defaults are used (see its .env.example).
      ADVAPACS_ACCESSION_NUMBER_SYSTEM: ${ADVAPACS_MEDIATOR_ACCESSION_NUMBER_SYSTEM}
      ADVAPACS_PLACER_ORDER_NUMBER_SYSTEM: ${ADVAPACS_MEDIATOR_PLACER_ORDER_NUMBER_SYSTEM}
      # The FHIR identifier systems for OpenMRS's patient and provider identifiers, as AdvaPACS gets them.
      ADVAPACS_PATIENT_IDENTIFIER_SYSTEM: "${ADVAPACS_MEDIATOR_PATIENT_IDENTIFIER_SYSTEM:?must be set: the FHIR identifier system of the patient identifier sent to AdvaPACS}"
      ADVAPACS_PRACTITIONER_IDENTIFIER_SYSTEM: ${ADVAPACS_MEDIATOR_PRACTITIONER_IDENTIFIER_SYSTEM}
      # Optional: OpenMRS Visit Location uuid -> AdvaPACS Site identifier, and the AdvaPACS Organisation
      # those Sites must belong to (see the mediator's .env.example). Empty, orders are sent without a Site.
      ADVAPACS_SITE_MAP: ${ADVAPACS_MEDIATOR_SITE_MAP}
      ADVAPACS_ORGANIZATION: ${ADVAPACS_MEDIATOR_ORGANIZATION}
      # The modality map (concept -> DICOM modality, loaded from OpenMRS's REST API): the concept source
      # it's built from, and how often it's reloaded (see the mediator's .env.example).
      MODALITY_SOURCE: ${ADVAPACS_MEDIATOR_MODALITY_SOURCE}
      MODALITY_MAP_REFRESH_MS: ${ADVAPACS_MEDIATOR_MODALITY_MAP_REFRESH_MS}
      MODALITY_MAP_RETRY_MS: ${ADVAPACS_MEDIATOR_MODALITY_MAP_RETRY_MS}
    healthcheck:
      # The mediator's own HTTP server, on MEDIATOR_PORT.
      test: ["CMD", "wget", "-qO-", "http://localhost:3500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${ADVAPACS_MEDIATOR_MEMORY_LIMIT}
