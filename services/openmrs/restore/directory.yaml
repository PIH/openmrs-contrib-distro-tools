# initialize, openmrs/: copies the directory into openmrs-data, then
# scripts/finish-data-restore.sh.

services:
  restore-openmrs-data-volume:
    image: ${ALPINE_IMAGE:?ALPINE_IMAGE must be set}
    container_name: ${SERVICE_NAME}-restore-openmrs-data-volume
    environment:
      - OWNER=${OPENMRS_DATA_OWNER:?OPENMRS_DATA_OWNER must be set}
    volumes:
      - ${OPENMRS_RESTORE_PATH:?OPENMRS_RESTORE_PATH must be set}:/source:ro
      - ${PIHX_TOOLS}/services/openmrs/scripts/finish-data-restore.sh:/finish-data-restore.sh:ro
      - openmrs-data:/target
    command: ["sh", "-c", "cp -a /source/. /target/ && sh /finish-data-restore.sh"]

x-pihx:
  # The owner for the restored files: the user the openmrs image runs as, unless set.
  image-user: {variable: OPENMRS_DATA_OWNER, service: openmrs}
