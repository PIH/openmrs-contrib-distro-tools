description: The OpenMRS application
requires: [openmrs-db]
# Runtime properties, set when the instance is created, as OMRS_EXTRA_<property>.
capture-env: [OMRS_EXTRA_]
backup: none
# initialize: openmrs-data from an archive or a directory named after the service (restore/*.yaml).
restore:
  - names: [openmrs.7z, openmrs.tar.gz, openmrs.tgz, openmrs.tar, openmrs.zip]
    overlay: restore/archive.yaml
  - names: [openmrs/]
    overlay: restore/directory.yaml
