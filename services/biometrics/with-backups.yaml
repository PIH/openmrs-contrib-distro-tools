# Added when the instance has the backups service: biometrics' backup script, and what it needs.
services:
  backups:
    volumes:
      - ${PIHX_TOOLS}/services/biometrics/scripts:/opt/backup-services/biometrics:ro
      # Read-write, unlike the other services' volumes: SQLite takes its locks there, and a database
      # in WAL mode (which Neurotechnology's library may choose) can't be read from a read-only mount.
      # The backup only reads it.
      - biometrics-data:/sources/biometrics-data
