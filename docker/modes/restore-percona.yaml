# Overlay used exclusively by `openmrs-docker <name> restore --from-percona`. Runs a one-shot
# init container that moves a prepared xtrabackup directory straight into the db-data volume
# before openmrs-db ever starts -- unlike --from-dump, this writes the datadir directly rather
# than going through MySQL's own SQL-import entrypoint.
#
# Set by the restore command itself, not persisted to the instance's env file:
#   RESTORE_PERCONA_PATH -- absolute path to a prepared xtrabackup backup directory on the host

services:
  percona-restore:
    image: partnersinhealth/percona-0.1-4
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-percona-restore
    volumes:
      - ${RESTORE_PERCONA_PATH:?RESTORE_PERCONA_PATH must be set}:/opt/backup:ro
      - db-data:/var/lib/mysql
    # --copy-back, not --move-back: /opt/backup is deliberately mounted read-only, and
    # --move-back's rename step can't unlink the source, so it falls back to copy + a failed
    # delete -- succeeding overall but emitting an "Error: unlink ... failed" line per file.
    command: ["sh", "-c", "innobackupex --copy-back --datadir=/var/lib/mysql /opt/backup && chown -R 999:999 /var/lib/mysql"]

  openmrs-db:
    depends_on:
      percona-restore:
        condition: service_completed_successfully
