# initialize, SEED_IMAGE_NAME for openmrs-data: the seed image extracts its data directory into
# openmrs-data, which is then complete (it was exported from a started instance). See README.md here.

services:
  seed:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-seed
    image: ${SEED_IMAGE_NAME:?SEED_IMAGE_NAME must be set}:${SEED_IMAGE_TAG?}
    volumes:
      - openmrs-data:/target/data

  openmrs-db:
    depends_on:
      seed:
        condition: service_completed_successfully
