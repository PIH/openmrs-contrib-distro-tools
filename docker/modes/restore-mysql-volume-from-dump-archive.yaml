# initialize, RESTORE_MYSQL_DUMP_PATH (.7z or .zip): extracts the archive's one dump (.sql or .sql.gz)
# into db-init, where MySQL's entrypoint imports it on first start. See README.md here.

services:
  restore-mysql-dump-archive:
    image: ${P7ZIP_IMAGE:?P7ZIP_IMAGE must be set}
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-restore-mysql-dump-archive
    environment:
      - ARCHIVE_PASSWORD
      - ARCHIVE_NAME=${RESTORE_MYSQL_DUMP_ARCHIVE_FILENAME:?RESTORE_MYSQL_DUMP_ARCHIVE_FILENAME must be set}
    volumes:
      - ${RESTORE_MYSQL_DUMP_PATH:?RESTORE_MYSQL_DUMP_PATH must be set}:/source/${RESTORE_MYSQL_DUMP_ARCHIVE_FILENAME:?RESTORE_MYSQL_DUMP_ARCHIVE_FILENAME must be set}:ro
      - ${DISTRO_TOOLS_UTILS_DIR:?DISTRO_TOOLS_UTILS_DIR must be set}/lib/in-container/extract.sh:/extract.sh:ro
      - db-init:/target
    command:
      - sh
      - -c
      - |
        set -e
        STAGING=/target/.restore-staging
        sh /extract.sh "/source/$$ARCHIVE_NAME" "$$STAGING"
        FILES=$$(find "$$STAGING" -type f)
        if [ -z "$$FILES" ] || [ "$$(echo "$$FILES" | wc -l)" -ne 1 ]; then
            echo "error: $$ARCHIVE_NAME must contain exactly one dump file" >&2
            exit 1
        fi
        case "$$FILES" in
            *.gz) mv "$$FILES" /target/dump.sql.gz ;;
            *)    mv "$$FILES" /target/dump.sql ;;
        esac
        rm -rf "$$STAGING"

  openmrs-db:
    depends_on:
      restore-mysql-dump-archive:
        condition: service_completed_successfully
    volumes:
      - db-init:/docker-entrypoint-initdb.d

volumes:
  db-init:
