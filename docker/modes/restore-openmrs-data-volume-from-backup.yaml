# initialize, RESTORE_OPENMRS_DATA_PATH (a directory): copies it into openmrs-data. See README.md
# here.

services:
  restore-openmrs-data-volume:
    image: alpine:3.21
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-restore-openmrs-data-volume
    volumes:
      - ${RESTORE_OPENMRS_DATA_PATH:?RESTORE_OPENMRS_DATA_PATH must be set}:/source:ro
      - openmrs-data:/target
    command: ["sh", "-c", "cp -a /source/. /target/"]

  openmrs-db:
    depends_on:
      restore-openmrs-data-volume:
        condition: service_completed_successfully
