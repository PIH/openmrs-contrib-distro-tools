# --dev: mounts the distro built in DISTRO_SOURCE_DIR over the openmrs image's, and publishes the
# Java debug port. See README.md here.

services:
  openmrs:
    environment:
      DEBUG: "true"
    ports:
      - ${OPENMRS_DEBUG_PORT?}:1044
    volumes:
      - ${DISTRO_SOURCE_DIR:?DISTRO_SOURCE_DIR must be set for --dev}/distro/target/distro/web:/openmrs/distribution
