# initialize, RESTORE_MYSQL_PERCONA_PATH (an archive or a directory): extracts the backup into
# percona-staging (a legacy flat percona.7z, or one <name>-percona/ folder), prepares it if it isn't
# already (innobackupex --apply-log; legacy nightly backups are), and copies it into db-data. See
# README.md here.

services:
  extract-percona-backup:
    image: ${P7ZIP_IMAGE:?P7ZIP_IMAGE must be set}
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-extract-percona-backup
    environment:
      - ARCHIVE_PASSWORD
      - SOURCE_NAME=${RESTORE_MYSQL_PERCONA_NAME:?RESTORE_MYSQL_PERCONA_NAME must be set}
    volumes:
      - ${RESTORE_MYSQL_PERCONA_PATH:?RESTORE_MYSQL_PERCONA_PATH must be set}:/source/${RESTORE_MYSQL_PERCONA_NAME:?RESTORE_MYSQL_PERCONA_NAME must be set}:ro
      - ${DISTRO_TOOLS_UTILS_DIR:?DISTRO_TOOLS_UTILS_DIR must be set}/lib/in-container/extract.sh:/extract.sh:ro
      - percona-staging:/staging
    command:
      - sh
      - -c
      - |
        set -e
        ROOT=$$(sh /extract.sh "/source/$$SOURCE_NAME" /staging/raw --print-root)
        if [ ! -f "$$ROOT/xtrabackup_checkpoints" ]; then
            echo "error: $$SOURCE_NAME isn't a Percona/xtrabackup backup (no xtrabackup_checkpoints)" >&2
            exit 1
        fi
        mv "$$ROOT" /staging/backup

  restore-mysql-volume:
    image: ${PERCONA_IMAGE:?PERCONA_IMAGE must be set}
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-restore-mysql-volume
    depends_on:
      extract-percona-backup:
        condition: service_completed_successfully
    volumes:
      - percona-staging:/staging
      - db-data:/var/lib/mysql
    command:
      - sh
      - -c
      - |
        set -e
        # innobackupex's own output is long; it's shown only if a step fails.
        run() { "$$@" > /tmp/innobackupex.log 2>&1 || { cat /tmp/innobackupex.log; exit 1; }; }
        if grep -q "backup_type = full-backuped" /staging/backup/xtrabackup_checkpoints; then
            echo "Preparing the backup (innobackupex --apply-log)"
            run innobackupex --apply-log /staging/backup
        fi
        echo "Copying the backup into db-data (innobackupex --copy-back)"
        run innobackupex --copy-back --datadir=/var/lib/mysql /staging/backup
        chown -R 999:999 /var/lib/mysql

volumes:
  percona-staging:
