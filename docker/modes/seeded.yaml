# Overlay used exclusively by `openmrs-docker <name> initialize` — brings up a transient
# `seed` service that populates the data/db-init volumes from a seed image, then exits, plus
# the extra `openmrs-db` volume mount that lets MySQL's own first-boot import pick up the
# seeded dump. `openmrs` itself is never brought up by `initialize` — the seed archive
# extracted straight into openmrs-data via `seed` (mounted at /target/data) is already that
# volume's complete, final state (that's how it was captured in the first place: a real prior
# boot's fully-populated data dir, exported as-is), so there's nothing left for OpenMRS to do
# to it. Never included by start/update/pull; nothing else needs it, since OpenMRS's own
# migration runner is idempotent and safe to run against an already-migrated database too.
#
# Required env vars: SEED_IMAGE_NAME (no site suffix appended here)
# Optional: SEED_IMAGE_TAG (default: latest)

services:
  seed:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-seed
    image: ${SEED_IMAGE_NAME:?SEED_IMAGE_NAME must be set}:${SEED_IMAGE_TAG:-latest}
    volumes:
      - openmrs-data:/target/data
      - db-init:/target/db-init

  openmrs-db:
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - db-init:/docker-entrypoint-initdb.d

volumes:
  db-init:
