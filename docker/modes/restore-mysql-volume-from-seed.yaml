# initialize, SEED_IMAGE_NAME for db-data: the seed image copies its dump into db-init, where MySQL's
# entrypoint imports it on first start. See README.md here.

services:
  seed:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-seed
    image: ${SEED_IMAGE_NAME:?SEED_IMAGE_NAME must be set}:${SEED_IMAGE_TAG?}
    volumes:
      - db-init:/target/db-init

  openmrs-db:
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - db-init:/docker-entrypoint-initdb.d

volumes:
  db-init:
