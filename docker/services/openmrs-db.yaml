name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  openmrs-db:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openmrs-db
    image: ${OPENMRS_DB_IMAGE_NAME?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}:${OPENMRS_DB_IMAGE_TAG?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}
    # Every OPENMRS_DB_OPT_<option> variable becomes a --<option>=<value> server flag (`_` becomes
    # `-`, which MySQL and MariaDB treat the same in option names); an empty value gives a bare
    # --<option>, e.g. OPENMRS_DB_OPT_skip_name_resolve=. Anything not set is the server's own
    # default. The defaults written into a new instance's env file are in openmrs-db.env.defaults.
    # The image's own entrypoint then does its usual first-boot setup.
    entrypoint:
      - bash
      - -c
      - |
        args=()
        for var in $${!OPENMRS_DB_OPT_@}; do
          opt=$${var#OPENMRS_DB_OPT_}
          opt=$${opt//_/-}
          if [ -n "$${!var}" ]; then args+=("--$$opt=$${!var}"); else args+=("--$$opt"); fi
        done
        [ $${#args[@]} -gt 0 ] || echo "No OPENMRS_DB_OPT_* variables set: starting with the server's own defaults" >&2
        server=mariadbd
        command -v mariadbd >/dev/null || server=mysqld
        exec docker-entrypoint.sh "$$server" "$${args[@]}"
    # Only the lines of the instance's env matching the "# container-env:" prefixes in
    # openmrs-db.env.defaults (OPENMRS_DB_OPT_*), which openmrs-docker copies into openmrs-db.env on
    # every command -- not every secret in env.
    env_file: openmrs-db.env
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}
      TZ: ${TZ:-UTC}
    ports:
      - ${OPENMRS_DB_PORT?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u${OPENMRS_DB_USER?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}", "-p${OPENMRS_DB_PASSWORD?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}", "openmrs", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENMRS_DB_MEMORY_LIMIT?not set in the instance's env; run 'openmrs-docker <instance> sync' to add the defaults}

volumes:
  db-data:
