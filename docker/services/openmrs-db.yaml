name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  openmrs-db:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openmrs-db
    image: ${OPENMRS_DB_IMAGE_NAME:-mysql}:${OPENMRS_DB_IMAGE_TAG:-5.6}
    # Adds the binary log flags, then hands over to the image's own entrypoint, which puts mysqld
    # or mariadbd in front of the flags itself. Binary logging is off unless
    # OPENMRS_DB_BINLOG_ENABLED=true (e.g. for a CDC tool such as Debezium). To turn it off without
    # leaving binlogs on disk, run utils/purge-binlogs.sh first: the server can only purge its own
    # binlogs while binary logging is on. Expiry is set under both names -- expire_logs_days
    # (MySQL 5.6/8.0, MariaDB) and binlog_expire_logs_seconds (MySQL 8.0+, MariaDB 10.6+) -- with
    # --loose- so each server ignores the one it doesn't have.
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        days="${OPENMRS_DB_BINLOG_EXPIRE_DAYS:-10}"
        [[ "$$days" =~ ^[0-9]+$$ ]] || { echo "OPENMRS_DB_BINLOG_EXPIRE_DAYS must be a whole number of days, got '$$days'" >&2; exit 1; }
        case "${OPENMRS_DB_BINLOG_ENABLED:-false}" in
          true)
            binlog_args=(--log-bin=mysql-bin --loose-expire_logs_days="$$days" --loose-binlog_expire_logs_seconds="$$((days * 86400))")
            ;;
          false)
            binlog_args=(--skip-log-bin)
            ;;
          *)
            echo "OPENMRS_DB_BINLOG_ENABLED must be true or false, got '${OPENMRS_DB_BINLOG_ENABLED:-}'" >&2
            exit 1
            ;;
        esac
        exec docker-entrypoint.sh "$${binlog_args[@]}" "$$@"
      - openmrs-db
    # OPENMRS_DB_EXTRA_ARGS comes last so it can override any flag above.
    command: >
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --log_bin_trust_function_creators=1
      --binlog_format=ROW
      --max_binlog_size=100M
      --server-id=${OPENMRS_DB_SERVER_ID:-1}
      --max_allowed_packet=${OPENMRS_DB_MAX_ALLOWED_PACKET:-1G}
      --innodb-buffer-pool-size=${OPENMRS_DB_INNODB_BUFFER_POOL_SIZE:-2G}
      --net_write_timeout=3600
      --net_read_timeout=3600
      ${OPENMRS_DB_EXTRA_ARGS:-}
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:-openmrs}
      TZ: ${TZ:-UTC}
    ports:
      - ${OPENMRS_DB_PORT:-3306}:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u${OPENMRS_DB_USER:-openmrs}", "-p${OPENMRS_DB_PASSWORD:-openmrs}", "openmrs", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENMRS_DB_MEMORY_LIMIT:-3g}

volumes:
  db-data:
