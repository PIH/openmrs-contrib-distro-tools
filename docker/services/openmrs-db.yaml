name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  openmrs-db:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openmrs-db
    image: ${OPENMRS_DB_IMAGE_NAME?}:${OPENMRS_DB_IMAGE_TAG?}
    # Every OPENMRS_DB_OPT_<option> variable becomes a --<option>=<value> server flag (`_` becomes
    # `-`, which MySQL and MariaDB treat the same in option names); an empty value gives a bare
    # --<option>, e.g. OPENMRS_DB_OPT_skip_name_resolve=. Anything not set is the server's own
    # default. The defaults written into a new instance's env file are in openmrs-db.env.defaults.
    # The image's own entrypoint then does its usual first-boot setup.
    entrypoint:
      - bash
      - -c
      - |
        args=()
        for var in $${!OPENMRS_DB_OPT_@}; do
          opt=$${var#OPENMRS_DB_OPT_}
          opt=$${opt//_/-}
          if [ -n "$${!var}" ]; then args+=("--$$opt=$${!var}"); else args+=("--$$opt"); fi
        done
        [ $${#args[@]} -gt 0 ] || echo "No OPENMRS_DB_OPT_* variables set: starting with the server's own defaults" >&2
        server=mariadbd
        command -v mariadbd >/dev/null || server=mysqld
        # Before the image sets up an empty data directory: mysql's images put the passwords into SQL
        # unescaped (a backslash in the root password fails the setup, and the openmrs user gets a
        # different password), and openmrs-core's first install writes the connection password into a
        # properties file unescaped. MariaDB's images escape them. An existing data directory isn't
        # checked: its accounts were set by other means (e.g. reset-openmrs-db-accounts).
        if [ -z "$$(ls -A /var/lib/mysql 2>/dev/null)" ]; then
          case "$$MYSQL_PASSWORD" in *\\*)
            echo "error: OPENMRS_DB_PASSWORD contains a backslash, which the openmrs user and OpenMRS's connection settings would get wrong on first setup. Choose a password without one." >&2
            exit 1 ;;
          esac
          if [ "$$server" = mysqld ]; then
            case "$$MYSQL_ROOT_PASSWORD" in *\\*)
              echo "error: OPENMRS_DB_ROOT_PASSWORD contains a backslash, which this MySQL image's first setup gets wrong. Choose a password without one." >&2
              exit 1 ;;
            esac
          fi
        fi
        exec docker-entrypoint.sh "$$server" "$${args[@]}"
    # Env's OPENMRS_DB_OPT_* lines only, written by openmrs-docker (see "# container-env:" in .env.defaults).
    env_file: openmrs-db.env
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER?}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD?}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD?}
      TZ: ${TZ?}
    ports:
      - ${OPENMRS_DB_PORT?}:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # The password from the container's own environment, in MYSQL_PWD, so it's on no command line
      # (the host's ps shows healthcheck processes). TCP, so it only passes once the real server runs.
      # MariaDB 11+ images have only the mariadb client.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" \"$$(command -v mysql || command -v mariadb)\" -h 127.0.0.1 -u \"$$MYSQL_USER\" openmrs -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENMRS_DB_MEMORY_LIMIT?}

volumes:
  db-data:
