name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  petl-sqlserver:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl-sqlserver
    image: mcr.microsoft.com/mssql/server:${PETL_SQLSERVER_IMAGE_TAG:-2019-CU13-ubuntu-20.04}
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${PETL_SQLSERVER_PASSWORD:-9%4qP7b2H!%J}
      TZ: ${TZ:-UTC}
    ports:
      - ${PETL_SQLSERVER_PORT:-1433}:1433
    volumes:
      - petl-sqlserver-data:/var/opt/mssql
    healthcheck:
      # Checks SQL Server itself is accepting connections, not the target database -- that
      # database doesn't exist yet at this point, it's created afterward by petl-sqlserver-init,
      # which is gated on this healthcheck passing.
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${PETL_SQLSERVER_PASSWORD:-9%4qP7b2H!%J}", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  # One-shot: creates PETL_SQLSERVER_DATABASE once petl-sqlserver is confirmed healthy, then exits.
  # The stock mssql/server image has no MYSQL_DATABASE-style "create this on first boot" mechanism
  # (unlike openmrs-db.yaml's MYSQL_DATABASE), so something has to run CREATE DATABASE itself --
  # this is a separate service rather than a custom image/entrypoint wrapping petl-sqlserver, so
  # there's no Dockerfile to build or keep in sync with Microsoft's own image. Uses the same image
  # (sqlcmd is already bundled in it) purely as a client, never runs sqlservr itself.
  petl-sqlserver-init:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl-sqlserver-init
    image: mcr.microsoft.com/mssql/server:${PETL_SQLSERVER_IMAGE_TAG:-2019-CU13-ubuntu-20.04}
    depends_on:
      petl-sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${PETL_SQLSERVER_PASSWORD:-9%4qP7b2H!%J}
      DATABASE_NAME: ${PETL_SQLSERVER_DATABASE:-openmrs_reporting}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools/bin/sqlcmd -S petl-sqlserver -U sa -d master
        -Q "IF DB_ID('$$DATABASE_NAME') IS NULL CREATE DATABASE [$$DATABASE_NAME]" &&
        echo "petl-sqlserver-init: database $$DATABASE_NAME is ready"

volumes:
  petl-sqlserver-data:
