name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  petl-sqlserver:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl-sqlserver
    image: mcr.microsoft.com/mssql/server:${PETL_SQLSERVER_IMAGE_TAG?}
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${PETL_SQLSERVER_PASSWORD?}
      # For sqlcmd, so the password isn't on its command line.
      SQLCMDPASSWORD: ${PETL_SQLSERVER_PASSWORD?}
      TZ: ${TZ?}
    ports:
      - ${PETL_SQLSERVER_PUBLISHED_PORT?}:1433
    volumes:
      - petl-sqlserver-data:/var/opt/mssql
    healthcheck:
      # SQL Server itself: petl-sqlserver-init creates the database once this passes.
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  # Creates PETL_SQLSERVER_DATABASE, which the stock image has no setting for, then exits. Same
  # image, as a sqlcmd client only.
  petl-sqlserver-init:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl-sqlserver-init
    image: mcr.microsoft.com/mssql/server:${PETL_SQLSERVER_IMAGE_TAG?}
    depends_on:
      petl-sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${PETL_SQLSERVER_PASSWORD?}
      DATABASE_NAME: ${PETL_SQLSERVER_DATABASE?}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools/bin/sqlcmd -S petl-sqlserver -U sa -d master
        -Q "IF DB_ID('$$DATABASE_NAME') IS NULL CREATE DATABASE [$$DATABASE_NAME]" &&
        echo "petl-sqlserver-init: database $$DATABASE_NAME is ready"

volumes:
  petl-sqlserver-data:
