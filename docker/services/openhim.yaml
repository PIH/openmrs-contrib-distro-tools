name: ${SERVICE_NAME:?SERVICE_NAME must be set}

# The standard OpenHIM install: mongo (openhim-core's own datastore),
# openhim-core, openhim-console, and openhim-setup. Intentionally generic --
# no mediator-specific configuration lives here. One or more mediator service
# fragments (e.g. openhim-advapacs-mediator.yaml) get composed alongside this
# one via SERVICES=/add-service, each reaching this fragment's services by
# their bare service keys (mongo-db, openhim-core, openhim-console), which
# must stay stable since those are the DNS names Compose hands out on the
# instance's default network.
#
# Inside the instance's Docker network everything is plain HTTP, including openhim-core's admin API
# (api_protocol); TLS for access from outside is the reverse proxy's job (Caddy on the app cluster).
#
# Published ports (on all interfaces; the host is firewalled and VPN-only), each for something
# outside the Docker network that uses it:
#   OPENHIM_CONSOLE_HOST_PORT       -> openhim-console:80   the admin console, for people
#   OPENHIM_ADMIN_API_HOST_PORT     -> openhim-core:8080    the admin API: the console runs in the
#                                                           admin's browser, which calls it directly
#   OPENHIM_ROUTER_HTTP_HOST_PORT   -> openhim-core:5001    the router, for external systems calling
#                                                           a channel (AdvaPACS's result webhook to
#                                                           the mediator). A proxy in front should
#                                                           forward only those channels' paths: some
#                                                           channels are public (e.g. the mediator's
#                                                           outbound /advapacs/*).
# Not published: openhim-core's HTTPS router (5000; the proxy terminates TLS), rerun, TCP adapter
# and polling (7786-7788, used inside openhim-core), and mongo-db (openhim-core only). Mediators
# reach openhim-core by service name, so they need nothing published either.
#
# openhim-setup is a one-shot job, not a long-running service: on a fresh
# Mongo volume, openhim-core's own image hardcodes its root account as
# root@openhim.org / openhim-password. openhim-setup changes the real password to
# match OPENHIM_PASSWORD once openhim-core is healthy; mediator fragments
# should depend on it via `service_completed_successfully` so they never race it.
# Idempotent and safe to rerun.

services:
  mongo-db:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-mongo-db
    image: mongo:${OPENHIM_MONGO_IMAGE_TAG?}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  openhim-core:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openhim-core
    image: jembi/openhim-core:${OPENHIM_CORE_IMAGE_TAG?}
    restart: unless-stopped
    # PID 1 is otherwise Node, which never reaps orphaned processes. An HTTPS healthcheck's
    # BusyBox wget left an ssl_client zombie each run, and each pinned a seccomp filter's BPF JIT
    # memory until the host could no longer start container processes (errno 524). The
    # healthcheck is plain HTTP now, but this keeps anything else from doing the same.
    init: true
    environment:
      # Named openhim since TASKS-596 (openhim-development before). An instance from before starts
      # on an empty database, which the setup job and the mediators provision again; the old one
      # stays in mongo-data until dropped (see README, "Adding OpenHIM and mediators").
      mongo_url: mongodb://mongo-db/openhim
      mongo_atnaUrl: mongodb://mongo-db/openhim
      # Not development, whose config turns on debug logging and the audit servers (5050-5052).
      NODE_ENV: production
      api_protocol: http
      api_authenticationTypes: '["token", "basic", "openid", "local"]'
      authentication_enableCustomTokenAuthentication: "true"
      # Off: nothing authenticates to OpenHIM with a JWT (the mediator's clients use Basic auth), and
      # with it on, anyone who knew the shared secret could sign a token as any client.
      authentication_enableJWTAuthentication: "false"
      # The console's address for links openhim-core generates (e.g. in emails).
      openhimConsoleBaseUrl: ${OPENHIM_CONSOLE_URL?}
    ports:
      - "${OPENHIM_ADMIN_API_HOST_PORT?}:8080"
      - "${OPENHIM_ROUTER_HTTP_HOST_PORT?}:5001"
    healthcheck:
      test: "wget -qO- http://openhim-core:8080/heartbeat || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openhim-setup:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openhim-setup
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      openhim-core:
        condition: service_healthy
    environment:
      OPENHIM_PASSWORD: ${OPENHIM_PASSWORD?}
    entrypoint: ["/bin/sh", "-c"]
    # $$-escaped throughout: Compose interpolates any unescaped $var in a compose
    # file itself (against its own host-side variable context) before this string
    # ever reaches the container.
    command:
      - |
        set -eu
        base="http://openhim-core:8080"
        email="root@openhim.org"
        default_password="openhim-password"
        # Credentials and body go to curl in files written by the shell's own printf, so the
        # password is on no command line (the host's ps shows those of processes in containers).
        # A " or \ in it is escaped, for curl's config and for JSON alike.
        esc() { printf '%s' "$$1" | sed 's/[\\"]/\\&/g'; }
        auth() { printf 'user = "%s:%s"\n' "$$email" "$$(esc "$$1")" > /tmp/auth; }
        # Already matches -- either a prior run of this same job already changed
        # it, or OPENHIM_PASSWORD was left at its own default. Either way, nothing
        # to do.
        auth "$$OPENHIM_PASSWORD"
        code=$$(curl -s -K /tmp/auth -o /dev/null -w '%{http_code}' "$$base/users")
        if [ "$$code" = "200" ]; then
          echo "OpenHIM admin password already matches OPENHIM_PASSWORD."
          exit 0
        fi
        # Authenticate with the image's real hardcoded default and change it.
        # firstname/surname/provider/groups are also hardcoded on this account by
        # openhim-core itself -- passed through unchanged here since a PUT only
        # updates the fields it's given.
        auth "$$default_password"
        printf '{"firstname":"Super","surname":"User","email":"%s","provider":"local","groups":["admin"],"password":"%s"}' \
          "$$email" "$$(esc "$$OPENHIM_PASSWORD")" > /tmp/body
        curl -sf -K /tmp/auth -X PUT "$$base/users/$$email" \
          -H 'Content-Type: application/json' -d @/tmp/body
        echo "OpenHIM admin password set to OPENHIM_PASSWORD."

  openhim-console:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openhim-console
    image: jembi/openhim-console:${OPENHIM_CONSOLE_IMAGE_TAG?}
    restart: unless-stopped
    # Where the console, running in the admin's browser, finds the admin API: as the browser sees
    # it (e.g. https, the console's own host behind the proxy, and a path the proxy forwards to the
    # admin API). The defaults are for a browser on the same machine, straight to the published port.
    environment:
      OPENHIM_CONSOLE_PROTOCOL: ${OPENHIM_CONSOLE_API_PROTOCOL?}
      OPENHIM_CORE_MEDIATOR_HOSTNAME: ${OPENHIM_CONSOLE_API_HOST?}
      OPENHIM_MEDIATOR_API_PORT: ${OPENHIM_CONSOLE_API_PORT?}
      OPENHIM_CONSOLE_HOSTPATH: ${OPENHIM_CONSOLE_API_PATH?}
    ports:
      - "${OPENHIM_CONSOLE_HOST_PORT?}:80"
    healthcheck:
      test: "wget -qO- http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  mongo-data:
