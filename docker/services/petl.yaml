name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  petl:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl
    # Compose interpolates every fragment on every command, so PETL_IMAGE_NAME may be empty
    # (its default) until petl is run: only `run-service petl` then fails, on the image name.
    image: ${PETL_IMAGE_NAME?}:${PETL_IMAGE_TAG?}
    profiles: ["petl"]
    depends_on:
      openmrs-db-accounts:
        condition: service_completed_successfully
      # Only when the instance has sqlserver (PETL may write to a SQL Server elsewhere).
      sqlserver-setup:
        condition: service_completed_successfully
        required: false
    # Env's PETL_*, DATASOURCES_*, SPRING_* and LOGGING_* lines (see "# container-env:" in .env.defaults).
    env_file: petl.env
    environment:
      PETL_MYSQL_HOST: openmrs-db
      PETL_MYSQL_PORT: 3306
      TZ: ${TZ?}
    volumes:
      - petl-data:/home/petl/data

volumes:
  petl-data:
