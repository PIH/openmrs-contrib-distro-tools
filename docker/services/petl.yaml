name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  petl:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-petl
    # Soft placeholder default rather than a `:?` guard: Compose interpolates every
    # fragment in the merged project on EVERY command (status, stop, destroy, ...), not
    # just when the `petl` profile is actually invoked. A hard `:?` here made an instance
    # with petl attached but PETL_IMAGE_NAME unset fail every command including destroy,
    # permanently trapping the instance directory. With a placeholder, only
    # `run-service petl` fails -- with an obvious "no such image" error.
    image: ${PETL_IMAGE_NAME?}:${PETL_IMAGE_TAG?}
    profiles: ["petl"]
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      PETL_FULL_REFRESH_JOBS: ${PETL_FULL_REFRESH_JOBS?}
      PETL_MAX_RETRIES: ${PETL_MAX_RETRIES?}
      PETL_MYSQL_HOST: openmrs-db
      PETL_MYSQL_PORT: 3306
      PETL_MYSQL_USER: ${PETL_MYSQL_USER?}
      PETL_MYSQL_PASSWORD: ${PETL_MYSQL_PASSWORD?}
      PETL_MYSQL_ROOT_PASSWORD: ${PETL_MYSQL_ROOT_PASSWORD?}
      PETL_SQLSERVER_HOST: ${PETL_SQLSERVER_HOST?}
      PETL_SQLSERVER_PORT: ${PETL_SQLSERVER_PORT?}
      PETL_SQLSERVER_USER: ${PETL_SQLSERVER_USER?}
      PETL_SQLSERVER_PASSWORD: ${PETL_SQLSERVER_PASSWORD?}
      TZ: ${TZ:-UTC}
