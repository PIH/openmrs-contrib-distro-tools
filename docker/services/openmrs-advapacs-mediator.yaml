name: ${SERVICE_NAME:?SERVICE_NAME must be set}

# The AdvaPACS radiology-order mediator. Requires the openhim service
# fragment (openhim.yaml) also be present on this instance -- it registers
# itself with, and is routed to by, that fragment's openhim-core. Waits on
# that fragment's openhim-setup job.
#
# The service key below (openmrs-advapacs-mediator) is NOT just a naming
# convention -- it's pinned by this mediator's own mediatorConfig.json
# (built into its image), which hardcodes its inbound channel's route host to
# that exact string. Compose hands out a DNS alias equal to a service's key
# on the instance's default network, independent of container_name, so this
# key must stay exactly as-is for openhim-core to be able to reach it. A
# second, different mediator sharing this same OpenHIM instance would get its
# own fragment file with its own service key, pinned the same way by its own
# mediatorConfig.json -- there's no shared name the two would need to agree
# on or could collide over.
#
services:
  openmrs-advapacs-mediator:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openmrs-advapacs-mediator
    image: ${ADVAPACS_MEDIATOR_IMAGE_NAME:-partnersinhealth/omrs-advapacs-mediator}:${ADVAPACS_MEDIATOR_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      openhim-core:
        condition: service_healthy
      openhim-setup:
        condition: service_completed_successfully
    extra_hosts:
      # Lets this container reach OpenMRS running on the host machine.
      - "host.docker.internal:host-gateway"
    environment:
      # Topology: hardcoded to the openhim-core service's network.'
      OPENHIM_API_URL: https://openhim-core:8080
      OPENHIM_TRUST_SELF_SIGNED: "true"
      OPENHIM_ROUTER_URL: http://openhim-core:5001
      ADVAPACS_CHANNEL_URL: http://openhim-core:5001/advapacs
      MEDIATOR_PORT: "3500"
      MEDIATOR_STANDALONE: "false"
      # Instance-wide, shared with any other mediator on this instance.
      # TODO: Do we want to namespace these in some way, specifically the openmrs parameters? Would this be at the OpenHIM or OpenMRS level?
      OPENHIM_USERNAME: ${OPENHIM_USERNAME}
      OPENHIM_PASSWORD: ${OPENHIM_PASSWORD}
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL}
      OPENMRS_FHIR_PATH: ${OPENMRS_FHIR_PATH}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD}
      # Mediator-specific, namespaced at the instance-env-file layer but passed through to the plain name this mediator's
      LOG_LEVEL: ${ADVAPACS_MEDIATOR_LOG_LEVEL:-info}
      MEDIATOR_INBOUND_SECRET: ${ADVAPACS_MEDIATOR_INBOUND_SECRET}
      ORDER_INGESTION_MODE: ${ADVAPACS_MEDIATOR_ORDER_INGESTION_MODE:-poll}
      ORDER_POLL_INTERVAL_MS: ${ADVAPACS_MEDIATOR_ORDER_POLL_INTERVAL_MS:-60000}
      OPENHIM_INBOUND_CLIENT_ID: ${ADVAPACS_MEDIATOR_OPENHIM_INBOUND_CLIENT_ID:-openmrs}
      OPENHIM_INBOUND_CLIENT_PASSWORD: ${ADVAPACS_MEDIATOR_OPENHIM_INBOUND_CLIENT_PASSWORD}
      # AdvaPACS-specific business config, already unique to this
      # integration -- no namespacing needed.
      PATIENT_IDENTIFIER_SYSTEM: ${ADVAPACS_PATIENT_IDENTIFIER_SYSTEM}
      ADVAPACS_BASE_URL: ${ADVAPACS_BASE_URL}
      ADVAPACS_CLIENT_ID: ${ADVAPACS_CLIENT_ID}
      ADVAPACS_CLIENT_SECRET: ${ADVAPACS_CLIENT_SECRET}
      ADVAPACS_WEBHOOK_SECRET: ${ADVAPACS_WEBHOOK_SECRET}
