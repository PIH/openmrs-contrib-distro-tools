name: ${SERVICE_NAME:?SERVICE_NAME must be set}

services:
  openmrs:
    container_name: ${SERVICE_NAME:?SERVICE_NAME must be set}-openmrs
    image: ${OPENMRS_IMAGE_NAME:?OPENMRS_IMAGE_NAME must be set}:${OPENMRS_IMAGE_TAG:-latest}
    build:
      # Soft default rather than a required (:?) guard: Compose interpolates this on
      # every invocation (stop/logs/wait/destroy/etc.), not just when actually
      # building, so a hard requirement here would break instances that never build.
      # openmrs-docker's require_distro_source() enforces the real requirement.
      context: ${DISTRO_SOURCE_DIR:-.}/distro/target/distro/web
    depends_on:
      openmrs-db:
        condition: service_healthy
        restart: true
    ports:
      - ${OPENMRS_HTTP_PORT:-8080}:8080
    # Relative to this file's own directory (the instance directory), not the CWD `docker compose`
    # is invoked from -- confirmed empirically, since openmrs-docker never `cd`s there. This is the
    # exact same file already passed as `--env-file` for the `${VAR}` interpolation below, so any
    # OMRS_EXTRA_* variable `create` captured from the calling shell (see bin/openmrs-docker)
    # reaches the container automatically, without a corresponding explicit `environment:` entry
    # here -- the generic counterpart to the two named OMRS_EXTRA_* translations below, which exist
    # only to map an existing friendly variable name (OPENMRS_PIH_CONFIG, etc.) onto the
    # OMRS_EXTRA_ convention.
    env_file:
      - env
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      # false when initialize restored db-data from a backup with no matching openmrs-data
      OMRS_CONFIG_CREATE_TABLES: "${OPENMRS_CREATE_TABLES:-true}"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      OMRS_EXTRA_PIH_CONFIG: ${OPENMRS_PIH_CONFIG:-}
      OMRS_JAVA_MEMORY_OPTS: ${OPENMRS_JAVA_MEMORY_OPTS:--Xms512m -Xmx2g -XX:NewSize=128m}
      OMRS_EXTRA_ACTIVITYLOG__ENABLED: ${OPENMRS_ACTIVITYLOG_ENABLED:-true}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/health/started"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 3600s
    volumes:
      - openmrs-data:/openmrs/data/
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OPENMRS_MEMORY_LIMIT:-4g}

volumes:
  openmrs-data:
